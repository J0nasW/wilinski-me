server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative Location headers, so redirects keep https behind the reverse proxy
    absolute_redirect off;
    include /etc/nginx/snippets/security-headers.conf;

    # Redirect root to /en/
    location = / {
        return 301 /en/;
    }

    # Short, stable URLs for the QR code / Apple Wallet pass
    # (302 so the target can change later without phones caching it)
    location = /qr { return 302 /en/card/?src=qr; }
    location ~ ^/card/?$ { return 302 /en/card/; }

    # Fingerprinted build assets never change
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.vcf$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Disposition 'attachment; filename="jonas-wilinski.vcf"';
        default_type text/vcard;
        types { }
        try_files $uri =404;
    }

    # Apple Wallet pass (unlisted URL, see scripts/build-wallet-pass.mjs)
    location /wallet/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        types { application/vnd.apple.pkpass pkpass; }
        try_files $uri =404;
    }

    # Handle all other routes
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Never serve dotfiles (e.g. a stray .git or .env in the build output)
    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 404 /404.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml text/vcard;
}
