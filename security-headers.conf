# Included in every block that sets add_header: nginx drops inherited
# add_header directives as soon as a location defines its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# The full CSP is emitted per page as a <meta> tag by Astro (see astro.config.mjs).
# frame-ancestors cannot be set via <meta>, so it lives here.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
